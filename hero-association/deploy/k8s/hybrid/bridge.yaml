apiVersion: v1
kind: ConfigMap
metadata:
  name: __SERVICE__-hybrid-bridge
  namespace: hero-association
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      ~*websocket upgrade;
      default '';
    }
    map $http_upgrade $websocket_upgrade {
      ~*websocket $http_upgrade;
      default '';
    }

    server {
      listen __SERVICE_PORT__;
      server_name _;
      access_log off;
      client_max_body_size 8m;

      location / {
        proxy_pass http://__WSL_HOST_IP__:__WSL_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $websocket_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE__-hybrid-bridge
  namespace: hero-association
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __SERVICE__
      hybrid: wsl
  template:
    metadata:
      labels:
        app: __SERVICE__
        hybrid: wsl
        sidecar.istio.io/inject: "__ISTIO_INJECT__"
    spec:
      serviceAccountName: __SERVICE_ACCOUNT__
      containers:
        - name: bridge
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: __SERVICE_PORT__
          readinessProbe:
            httpGet:
              path: __READY_PATH__
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap:
            name: __SERVICE__-hybrid-bridge
