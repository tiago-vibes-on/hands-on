apiVersion: apps/v1
kind: Deployment
metadata:
  name: expedition
  namespace: hero-association
spec:
  template:
    spec:
      containers:
        - name: expedition
          env:
            - name: HERO_ASSOCIATION_OIDC_ISSUER
              value: https://auth.e2e.heroassociation.test/realms/hero-association
            - name: HERO_ASSOCIATION_EXPEDITION_PLAYER_API_ENABLED
              value: "true"
            - name: HERO_ASSOCIATION_EXPEDITION_VISUAL_API_ENABLED
              value: "true"
            - name: HERO_ASSOCIATION_EXPEDITION_SETTLEMENT_ENABLED
              value: "true"
            - name: HERO_ASSOCIATION_EXPEDITION_ADMISSION_RECONCILER_ENABLED
              value: "true"
