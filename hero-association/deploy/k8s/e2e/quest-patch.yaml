apiVersion: apps/v1
kind: Deployment
metadata:
  name: quest
  namespace: hero-association
spec:
  replicas: 2
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: 'false'
    spec:
      containers:
      - name: quest
        env:
        - name: HERO_ASSOCIATION_OIDC_ISSUER
          value: https://auth.e2e.heroassociation.test/realms/hero-association
