apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: hero-association-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hero-association
  namespace: hero-association
spec:
  gatewayClassName: hero-association-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hero-association-k3d-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: hero-association
spec:
  parentRefs:
    - name: hero-association
      sectionName: http
  hostnames:
    - k3d.heroassociation.test
    - auth.k3d.heroassociation.test
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 19443
            statusCode: 301
