apiVersion: v1
kind: Service
metadata:
  name: redis-gateway-ha
  namespace: envoy-gateway-system
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis-gateway-ha
  ports:
    - name: redis
      port: 6379
      targetPort: redis
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-gateway-ha
  namespace: envoy-gateway-system
spec:
  serviceName: redis-gateway-ha
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis-gateway-ha
  template:
    metadata:
      labels:
        app: redis-gateway-ha
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: redis-gateway-ha
              topologyKey: kubernetes.io/hostname
      containers:
        - name: redis
          image: redis:8.4.1-alpine
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: [/bin/sh, -ec]
          args:
            - |
              if [ "$POD_NAME" != redis-gateway-ha-0 ]; then
                exec redis-server --save "" --appendonly no \
                  --replicaof redis-gateway-ha-0.redis-gateway-ha.envoy-gateway-system.svc.cluster.local 6379
              fi
              exec redis-server --save "" --appendonly no
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        - name: sentinel
          image: redis:8.4.1-alpine
          command: [/bin/sh, -ec]
          args:
            - |
              config=/data/sentinel.conf
              if [ ! -s "$config" ]; then
                printf '%s\n' \
                  'port 26379' \
                  'sentinel resolve-hostnames yes' \
                  'sentinel announce-hostnames yes' \
                  'sentinel monitor gateway redis-gateway-ha-0.redis-gateway-ha.envoy-gateway-system.svc.cluster.local 6379 2' \
                  'sentinel down-after-milliseconds gateway 5000' \
                  'sentinel failover-timeout gateway 30000' \
                  'sentinel parallel-syncs gateway 1' > "$config"
              fi
              exec redis-server "$config" --sentinel
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command: [/bin/sh, -ec, "redis-cli -p 26379 sentinel ckquorum gateway | grep -q '^OK'"]
            periodSeconds: 5
          volumeMounts:
            - name: sentinel-data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: sentinel-data
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-gateway-ha
  namespace: envoy-gateway-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: redis-gateway-ha
