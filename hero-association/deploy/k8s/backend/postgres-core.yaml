apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-core-data
  namespace: hero-association
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-core
  namespace: hero-association
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-core
  template:
    metadata:
      labels:
        app: postgres-core
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          env:
            - name: POSTGRES_DB
              value: hero_association
            - name: POSTGRES_USER
              value: hero_association
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hero-association-k3d-credentials
                  key: CORE_DATABASE_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, -U, hero_association, -d, hero_association]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [pg_isready, -U, hero_association, -d, hero_association]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-core-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-core
  namespace: hero-association
spec:
  type: ClusterIP
  selector:
    app: postgres-core
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
