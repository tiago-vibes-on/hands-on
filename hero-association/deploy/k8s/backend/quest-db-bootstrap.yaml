apiVersion: batch/v1
kind: Job
metadata:
  generateName: quest-db-bootstrap-
  namespace: hero-association
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: quest-db-bootstrap
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: hero-association-quest:k3d
          imagePullPolicy: Never
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres-quest:5432/hero_association_quest
            - name: QUARKUS_DATASOURCE_USERNAME
              value: hero_association_quest
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hero-association-quest-credentials
                  key: QUEST_DATABASE_PASSWORD
            - name: QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY
              value: drop-and-create
            - name: QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT
              value: import.sql
            - name: QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_HALT_ON_ERROR
              value: "true"
            - name: HERO_ASSOCIATION_QUEST_BOOTSTRAP_MODE
              value: "true"
            - name: QUARKUS_OIDC_ENABLED
              value: "false"
            - name: QUARKUS_SCHEDULER_ENABLED
              value: "false"
            - name: HERO_ASSOCIATION_OTEL_DISABLED
              value: "true"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 1Gi
