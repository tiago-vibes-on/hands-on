apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-quest-data
  namespace: hero-association
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-quest
  namespace: hero-association
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-quest
  template:
    metadata:
      labels:
        app: postgres-quest
        sidecar.istio.io/inject: 'false'
    spec:
      containers:
      - name: postgres
        image: postgres:18.6-alpine3.24
        env:
        - name: POSTGRES_DB
          value: hero_association_quest
        - name: POSTGRES_USER
          value: hero_association_quest
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hero-association-quest-credentials
              key: QUEST_DATABASE_PASSWORD
        ports:
        - name: postgres
          containerPort: 5432
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - hero_association_quest
            - -d
            - hero_association_quest
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - hero_association_quest
            - -d
            - hero_association_quest
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-quest-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-quest
  namespace: hero-association
spec:
  type: ClusterIP
  selector:
    app: postgres-quest
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
