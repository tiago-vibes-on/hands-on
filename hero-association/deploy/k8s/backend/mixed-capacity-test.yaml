# Isolated k3d mixed-load stack. The runner substitutes its temporary database
# name before creation and removes every resource after the run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-capacity-test
  namespace: hero-association
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: core-capacity-test
  template:
    metadata:
      labels:
        app: core-capacity-test
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: hero-association-core
      terminationGracePeriodSeconds: 45
      containers:
        - name: core-capacity-test
          image: hero-association-core:k3d
          imagePullPolicy: Never
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres-core:5432/REPLACE_WITH_TEST_DATABASE
            - name: QUARKUS_DATASOURCE_USERNAME
              value: hero_association
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hero-association-k3d-credentials
                  key: CORE_DATABASE_PASSWORD
            - name: HERO_ASSOCIATION_CORE_REDIS_URL
              value: redis://redis-core:6379
            - name: HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL
              value: http://keycloak:8080/realms/hero-association
            - name: HERO_ASSOCIATION_OTLP_ENDPOINT
              value: http://otel-lgtm.hero-association-observability.svc.cluster.local:4317
            - name: HERO_ASSOCIATION_OTEL_DISABLED
              value: "false"
            - name: HERO_ASSOCIATION_OIDC_ISSUER
              value: https://auth.k3d.heroassociation.test/realms/hero-association
          ports:
            - name: http
              containerPort: 8081
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 384Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: core-capacity-test
  namespace: hero-association
spec:
  type: ClusterIP
  selector:
    app: core-capacity-test
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-capacity-test
  namespace: hero-association
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bff-capacity-test
  template:
    metadata:
      labels:
        app: bff-capacity-test
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: hero-association-bff
      terminationGracePeriodSeconds: 45
      containers:
        - name: bff-capacity-test
          image: hero-association-bff:k3d
          imagePullPolicy: Never
          env:
            - name: HERO_ASSOCIATION_CORE_BASE_URL
              value: http://core-capacity-test:8081
            - name: HERO_ASSOCIATION_FRONTEND_URL
              value: https://k3d.heroassociation.test
            - name: HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL
              value: http://keycloak:8080/realms/hero-association
            - name: HERO_ASSOCIATION_OIDC_AUTHORIZATION_PATH
              value: https://auth.k3d.heroassociation.test/realms/hero-association/protocol/openid-connect/auth
            - name: HERO_ASSOCIATION_OIDC_ISSUER
              value: https://auth.k3d.heroassociation.test/realms/hero-association
            - name: QUARKUS_OIDC_END_SESSION_PATH
              value: https://auth.k3d.heroassociation.test/realms/hero-association/protocol/openid-connect/logout
            - name: HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hero-association-k3d-credentials
                  key: HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET
            - name: HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: hero-association-k3d-credentials
                  key: HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET
            - name: HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY
              valueFrom:
                secretKeyRef:
                  name: hero-association-k3d-credentials
                  key: HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY
            - name: HERO_ASSOCIATION_BFF_REDIS_URL
              value: redis://redis-bff:6379
            - name: HERO_ASSOCIATION_OTLP_ENDPOINT
              value: http://otel-lgtm.hero-association-observability.svc.cluster.local:4317
            - name: HERO_ASSOCIATION_OTEL_DISABLED
              value: "false"
            - name: HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE
              value: "true"
            - name: QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED
              value: "true"
            - name: QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_HOST
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 300m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bff-capacity-test
  namespace: hero-association
spec:
  type: ClusterIP
  selector:
    app: bff-capacity-test
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff-capacity-test
  namespace: hero-association
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff-capacity-test
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-capacity-test
  namespace: hero-association
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-capacity-test
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-capacity-test
  namespace: hero-association
spec:
  parentRefs:
    - name: hero-association
      sectionName: https
  hostnames:
    - k3d.heroassociation.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - type: Exact
              name: X-Hero-Association-Capacity-Test
              value: capacity
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Host
                value: k3d.heroassociation.test
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Port
                value: "443"
      backendRefs:
        - name: bff-capacity-test
          port: 8080
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: core-capacity-test-strict-mtls
  namespace: hero-association
spec:
  selector:
    matchLabels:
      app: core-capacity-test
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: core-capacity-test-from-bff
  namespace: hero-association
spec:
  selector:
    matchLabels:
      app: core-capacity-test
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/hero-association/sa/hero-association-bff
