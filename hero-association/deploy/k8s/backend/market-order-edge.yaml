apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: market-order-placement
  namespace: hero-association
spec:
  parentRefs:
    - name: hero-association
      sectionName: https
  hostnames:
    - heroassociation.test
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /api/v1/market/orders
        - method: POST
          path:
            type: Exact
            value: /api/v1/market/orders/
      backendRefs:
        - name: bff
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: market-order-identity
  namespace: hero-association
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: market-order-placement
  extAuth:
    headersToExtAuth:
      - Cookie
      - X-CSRF-TOKEN
    timeout: 2s
    failOpen: false
    http:
      pathOverride: /internal/market-order-identity
      backendRefs:
        - name: bff
          port: 8080
      headersToBackend:
        - X-Hero-Association-Subject
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: market-order-per-user-limit
  namespace: hero-association
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: market-order-placement
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: X-Hero-Association-Subject
                  type: Distinct
          limit:
            requests: 5
            unit: Second
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 429
      source: Local
      response:
        statusCode: 429
        contentType: application/json
        header:
          set:
            - name: Retry-After
              value: "1"
            - name: X-Hero-Association-Rate-Limit-Layer
              value: envoy
        body:
          type: Inline
          inline: '{"message":"Market order placement is limited to five requests per second."}'
