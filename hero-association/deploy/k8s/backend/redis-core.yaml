apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-core
  namespace: hero-association
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-core
  template:
    metadata:
      labels:
        app: redis-core
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: redis
          image: redis:8.4.1-alpine
          command: [redis-server, --save, "", --appendonly, "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-core
  namespace: hero-association
spec:
  type: ClusterIP
  selector:
    app: redis-core
  ports:
    - name: redis
      port: 6379
      targetPort: redis
