apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-concurrency-test
  namespace: hero-association
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-concurrency-test
  template:
    metadata:
      labels:
        app: core-concurrency-test
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: hero-association-core
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: core-concurrency-test
      containers:
        - name: core
          image: hero-association-core:k3d
          imagePullPolicy: Never
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://postgres-core:5432/REPLACE_WITH_TEST_DATABASE
            - name: QUARKUS_DATASOURCE_USERNAME
              value: hero_association
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hero-association-k3d-credentials
                  key: CORE_DATABASE_PASSWORD
            - name: HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL
              value: http://keycloak:8080/realms/hero-association
            - name: HERO_ASSOCIATION_OIDC_ISSUER
              value: https://auth.heroassociation.test:8443/realms/hero-association
            - name: HERO_ASSOCIATION_OTEL_DISABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
