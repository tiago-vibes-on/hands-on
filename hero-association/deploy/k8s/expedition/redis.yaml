apiVersion: v1
kind: Service
metadata:
  name: redis-expedition
  namespace: hero-association
spec:
  clusterIP: None
  selector:
    app: redis-expedition
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-expedition
  namespace: hero-association
spec:
  serviceName: redis-expedition
  replicas: 1
  selector:
    matchLabels:
      app: redis-expedition
  template:
    metadata:
      labels:
        app: redis-expedition
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: redis
          image: redis:8.4.1-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - always
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
