apiVersion: v1
kind: ServiceAccount
metadata:
  name: hero-association-expedition
  namespace: hero-association
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expedition
  namespace: hero-association
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expedition
  template:
    metadata:
      labels:
        app: expedition
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: hero-association-expedition
      containers:
        - name: expedition
          image: hero-association-expedition:k3d
          imagePullPolicy: Never
          env:
            - name: HERO_ASSOCIATION_EXPEDITION_HTTP_PORT
              value: "8083"
            - name: HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL
              value: http://keycloak:8080/realms/hero-association
            - name: HERO_ASSOCIATION_OIDC_ISSUER
              value: https://auth.heroassociation.test/realms/hero-association
            - name: HERO_ASSOCIATION_CORE_BASE_URL
              value: http://core:8081
            - name: HERO_ASSOCIATION_EXPEDITION_REDIS_URL
              value: redis://redis-expedition:6379
            - name: HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST
              value: rabbitmq-expedition
            - name: HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST_PORT
              value: "5672"
            - name: HERO_ASSOCIATION_EXPEDITION_WORKER_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hero-association-expedition-credentials
                  key: HERO_ASSOCIATION_EXPEDITION_WORKER_RABBITMQ_PASSWORD
            - name: HERO_ASSOCIATION_EXPEDITION_CORE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: hero-association-expedition-credentials
                  key: HERO_ASSOCIATION_EXPEDITION_CORE_SERVICE_KEY
            - name: HERO_ASSOCIATION_EXPEDITION_BFF_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: hero-association-expedition-credentials
                  key: HERO_ASSOCIATION_EXPEDITION_BFF_SERVICE_KEY
            - name: HERO_ASSOCIATION_EXPEDITION_WORKER_ENABLED
              value: "true"
            - name: HERO_ASSOCIATION_EXPEDITION_PLAYER_API_ENABLED
              value: "false"
            - name: HERO_ASSOCIATION_EXPEDITION_VISUAL_API_ENABLED
              value: "false"
            - name: HERO_ASSOCIATION_EXPEDITION_SETTLEMENT_ENABLED
              value: "false"
            - name: HERO_ASSOCIATION_EXPEDITION_ADMISSION_RECONCILER_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 8083
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: expedition
  namespace: hero-association
spec:
  type: ClusterIP
  selector:
    app: expedition
  ports:
    - name: http
      port: 8083
      targetPort: http
