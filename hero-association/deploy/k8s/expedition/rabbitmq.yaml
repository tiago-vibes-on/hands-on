apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-expedition
  namespace: hero-association
spec:
  clusterIP: None
  selector:
    app: rabbitmq-expedition
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-expedition
  namespace: hero-association
spec:
  serviceName: rabbitmq-expedition
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-expedition
  template:
    metadata:
      labels:
        app: rabbitmq-expedition
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2.9-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: hero_association_expedition
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: hero-association-expedition-credentials
                  key: HERO_ASSOCIATION_EXPEDITION_RABBITMQ_PASSWORD
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          startupProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_running]
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
