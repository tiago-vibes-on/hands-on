# Apply only for a temporary HTTPS routing check, then delete this file's resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-smoke
  namespace: hero-association
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-smoke
  template:
    metadata:
      labels:
        app: gateway-smoke
    spec:
      containers:
        - name: httpd
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - 'mkdir -p /www; printf "envoy-gateway-ok\n" > /www/__gateway_smoke; exec httpd -f -p 8080 -h /www'
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-smoke
  namespace: hero-association
spec:
  selector:
    app: gateway-smoke
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-smoke
  namespace: hero-association
spec:
  parentRefs:
    - name: hero-association
      sectionName: https
  hostnames:
    - k3d.heroassociation.test
  rules:
    - matches:
        - path:
            type: Exact
            value: /__gateway_smoke
      backendRefs:
        - name: gateway-smoke
          port: 8080
