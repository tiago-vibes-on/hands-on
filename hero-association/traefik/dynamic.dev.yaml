http:
  routers:
    bff:
      rule: 'Host(`heroassociation.test`) && (PathPrefix(`/api`) || PathPrefix(`/auth`))'
      entryPoints: [websecure]
      service: bff
      tls: {}
      priority: 100
    frontend:
      rule: 'Host(`heroassociation.test`)'
      entryPoints: [websecure]
      service: frontend
      tls: {}
    keycloak:
      rule: 'Host(`auth.heroassociation.test`)'
      entryPoints: [websecure]
      service: keycloak
      tls: {}
  services:
    bff:
      loadBalancer:
        servers:
          - url: http://dev-host:17080
    frontend:
      loadBalancer:
        servers:
          - url: http://dev-host:15172
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080

tls:
  certificates:
    - certFile: /etc/traefik/certs/local.crt
      keyFile: /etc/traefik/certs/local.key
