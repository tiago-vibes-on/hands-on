http:
  routers:
    bff:
      rule: 'Host(`heroassociation.test`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/ws`))'
      entryPoints: [websecure]
      service: bff
      tls: {}
      priority: 100
    secondary-bff:
      rule: 'Host(`heroassociation.test`) && PathPrefix(`/__e2e-secondary/`)'
      entryPoints: [websecure]
      middlewares: [strip-e2e-secondary]
      service: secondary-bff
      tls: {}
      priority: 200
    frontend:
      rule: 'Host(`heroassociation.test`)'
      entryPoints: [websecure]
      service: frontend
      tls: {}
    keycloak:
      rule: 'Host(`auth.heroassociation.test`)'
      entryPoints: [websecure]
      service: keycloak
      tls: {}
  middlewares:
    strip-e2e-secondary:
      stripPrefix:
        prefixes: [/__e2e-secondary]
  services:
    bff:
      loadBalancer:
        servers:
          - url: http://bff:8080
    secondary-bff:
      loadBalancer:
        servers:
          - url: http://bff-secondary:8080
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:80
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080

tls:
  certificates:
    - certFile: /etc/traefik/certs/local.crt
      keyFile: /etc/traefik/certs/local.key
