quarkus.application.name=hero-association-core
quarkus.http.port=8081

quarkus.oidc.auth-server-url=${HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/hero-association}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.client-id=hero-association-core
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${HERO_ASSOCIATION_OIDC_ISSUER:http://localhost:8180/realms/hero-association}
quarkus.oidc.token.audience=hero-association-core
quarkus.oidc.token.subject-required=true

quarkus.http.auth.permission.game-api.paths=/api/*
quarkus.http.auth.permission.game-api.policy=authenticated

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18.6-alpine3.24
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/hero_association
%dev.quarkus.datasource.username=hero_association
%dev.quarkus.datasource.password=hero_association
%dev.quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.scheduler.enabled=false
%test.quarkus.oidc.enabled=false
