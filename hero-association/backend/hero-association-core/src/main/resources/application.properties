quarkus.application.name=hero-association-core

quarkus.otel.exporter.otlp.endpoint=${HERO_ASSOCIATION_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.propagators=tracecontext
quarkus.otel.logs.level=INFO
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
# Raw agency paths contain persistent IDs; keep their metrics, not their traces.
quarkus.otel.traces.suppress-application-uris=api/v1/agencies*
quarkus.otel.sdk.disabled=${HERO_ASSOCIATION_OTEL_DISABLED:true}
%test.quarkus.otel.sdk.disabled=false
%test.quarkus.otel.exporter.otlp.enabled=false
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.http.port=8081
%dev.quarkus.http.port=${HERO_ASSOCIATION_CORE_HTTP_PORT:17081}

quarkus.oidc.auth-server-url=${HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL:http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:17180}/realms/hero-association}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.client-id=hero-association-core
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${HERO_ASSOCIATION_OIDC_ISSUER:https://auth.heroassociation.test/realms/hero-association}
quarkus.oidc.token.audience=hero-association-core
quarkus.oidc.token.subject-required=true

quarkus.http.auth.permission.game-api.paths=/api/*
quarkus.http.auth.permission.game-api.policy=authenticated

hero-association.core.expedition.enabled=${HERO_ASSOCIATION_CORE_EXPEDITION_ENABLED:false}
hero-association.core.expedition.rabbitmq.host=${HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST:localhost}
hero-association.core.expedition.rabbitmq.port=${HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST_PORT:15675}
hero-association.core.expedition.rabbitmq.username=${HERO_ASSOCIATION_CORE_SETTLEMENT_RABBITMQ_USER:hero_association_core_settlement}
hero-association.core.expedition.rabbitmq.password=${HERO_ASSOCIATION_CORE_SETTLEMENT_RABBITMQ_PASSWORD:hero_association_core_settlement}



quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18.6-alpine3.24
%test.quarkus.datasource.devservices.reuse=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${HERO_ASSOCIATION_CORE_DATABASE_HOST_PORT:15431}/hero_association
%dev.quarkus.datasource.username=hero_association
%dev.quarkus.datasource.password=hero_association
%dev.quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=import.sql
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql
hero-association.core.bootstrap-mode=${HERO_ASSOCIATION_CORE_BOOTSTRAP_MODE:false}
%test.quarkus.scheduler.enabled=false
%test.quarkus.oidc.enabled=false
%test.hero-association.expedition.core-service-key=test-only-expedition-core-service-key-0123456789
%test.quarkus.http.test-port=0

# Assets owns economic data. Core owns identity, eligibility, and durable orchestration.
hero-association.assets.base-url=${HERO_ASSOCIATION_ASSETS_BASE_URL:http://localhost:17085}
hero-association.assets.core-service-key=${HERO_ASSOCIATION_ASSETS_CORE_SERVICE_KEY:}
hero-association.world.base-url=${HERO_ASSOCIATION_WORLD_BASE_URL:http://localhost:17086}
hero-association.world.service-key=${HERO_ASSOCIATION_WORLD_SERVICE_KEY:}
hero-association.quest.base-url=${HERO_ASSOCIATION_QUEST_BASE_URL:http://localhost:17087}
hero-association.quest.core-service-key=${HERO_ASSOCIATION_QUEST_CORE_SERVICE_KEY:}
