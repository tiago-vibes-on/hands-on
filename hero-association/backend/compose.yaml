name: hero-association
services:
  postgres-keycloak:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Copy .env.example to .env and
        set KEYCLOAK_DATABASE_PASSWORD.}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
    - postgres_keycloak_data:/var/lib/postgresql
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm --spi-theme-static-max-age=-1 --spi-theme-cache-themes=false
      --spi-theme-cache-templates=false
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Copy .env.example
        to .env and set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME.}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Copy .env.example
        to .env and set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD.}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Copy .env.example to .env and
        set KEYCLOAK_DATABASE_PASSWORD.}
      KC_HOSTNAME: http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}
      HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET: ${HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET:?Copy
        .env.example to .env and set HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET.}
    ports:
    - ${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}:8080
    volumes:
    - ./keycloak/realm:/opt/keycloak/data/import:ro
    - ./keycloak/theme:/opt/keycloak/themes:ro
  postgres-core:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: hero_association
      POSTGRES_USER: hero_association
      POSTGRES_PASSWORD: hero_association
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
    - postgres_core_data:/var/lib/postgresql
    ports:
    - ${HERO_ASSOCIATION_CORE_DATABASE_HOST_PORT:-15431}:5432
  redis-bff:
    image: redis:8.4.1-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
    - ${HERO_ASSOCIATION_BFF_REDIS_HOST_PORT:-16379}:6379
  core:
    build:
      context: .
      dockerfile: hero-association-core/Dockerfile
    depends_on:
      postgres-core:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-core:5432/hero_association
      QUARKUS_DATASOURCE_USERNAME: hero_association
      QUARKUS_DATASOURCE_PASSWORD: hero_association
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: drop-and-create
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: import.sql
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/hero-association
      HERO_ASSOCIATION_OIDC_ISSUER: http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}/realms/hero-association
      HERO_ASSOCIATION_ASSETS_CORE_SERVICE_KEY: ${HERO_ASSOCIATION_ASSETS_CORE_SERVICE_KEY:?Set
        the dedicated Core Assets credential.}
      HERO_ASSOCIATION_ASSETS_BASE_URL: http://assets:8085
      HERO_ASSOCIATION_WORLD_BASE_URL: http://world:8086
      HERO_ASSOCIATION_QUEST_BASE_URL: http://quest:8087
      HERO_ASSOCIATION_WORLD_SERVICE_KEY: ${HERO_ASSOCIATION_WORLD_SERVICE_KEY:?Set
        the dedicated service credential of at least 32 characters.}
      HERO_ASSOCIATION_QUEST_CORE_SERVICE_KEY: ${HERO_ASSOCIATION_QUEST_CORE_SERVICE_KEY:?Set
        the dedicated service credential of at least 32 characters.}
    expose:
    - '8081'
  postgres-market:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: hero_association_market
      POSTGRES_USER: hero_association_market
      POSTGRES_PASSWORD: ${HERO_ASSOCIATION_MARKET_DATABASE_PASSWORD:?Set the separate
        Market database password.}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
    - postgres_market_data:/var/lib/postgresql
    ports:
    - ${HERO_ASSOCIATION_MARKET_DATABASE_HOST_PORT:-15433}:5432
  market:
    build:
      context: .
      dockerfile: hero-association-market/Dockerfile
    depends_on:
      postgres-market:
        condition: service_healthy
      assets:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-market:5432/hero_association_market
      QUARKUS_DATASOURCE_USERNAME: hero_association_market
      QUARKUS_DATASOURCE_PASSWORD: ${HERO_ASSOCIATION_MARKET_DATABASE_PASSWORD:?Set
        the separate Market database password.}
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: drop-and-create
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: import.sql
      HERO_ASSOCIATION_ASSETS_MARKET_SERVICE_KEY: ${HERO_ASSOCIATION_ASSETS_MARKET_SERVICE_KEY:?Set
        a dedicated Market Assets service key of at least 32 characters.}
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/hero-association
      HERO_ASSOCIATION_OIDC_ISSUER: http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}/realms/hero-association
      HERO_ASSOCIATION_ASSETS_BASE_URL: http://assets:8085
    expose:
    - '8084'
  bff:
    build:
      context: ./hero-association-bff
    depends_on:
      core:
        condition: service_started
      market:
        condition: service_started
      redis-bff:
        condition: service_healthy
      assets:
        condition: service_started
    environment:
      HERO_ASSOCIATION_CORE_BASE_URL: http://core:8081
      HERO_ASSOCIATION_MARKET_BASE_URL: http://market:8084
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/hero-association
      HERO_ASSOCIATION_OIDC_AUTHORIZATION_PATH: http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}/realms/hero-association/protocol/openid-connect/auth
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}/realms/hero-association
      HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET: ${HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET:?Copy
        .env.example to .env and set HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET.}
      HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET: ${HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET:?Copy
        .env.example to .env and set HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET.}
      HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY: ${HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY:?Copy
        .env.example to .env and set HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY.}
      HERO_ASSOCIATION_BFF_REDIS_URL: redis://redis-bff:6379
      HERO_ASSOCIATION_ASSETS_BASE_URL: http://assets:8085
      HERO_ASSOCIATION_WORLD_BASE_URL: http://world:8086
      HERO_ASSOCIATION_QUEST_BASE_URL: http://quest:8087
    ports:
    - ${HERO_ASSOCIATION_BFF_HTTP_PORT:-17080}:8080
  postgres-assets:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: hero_association_assets
      POSTGRES_USER: hero_association_assets
      POSTGRES_PASSWORD: ${HERO_ASSOCIATION_ASSETS_DATABASE_PASSWORD:?Set the separate
        Assets database password.}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
    - postgres_assets_data:/var/lib/postgresql
    ports:
    - ${HERO_ASSOCIATION_ASSETS_DATABASE_HOST_PORT:-15435}:5432
  assets:
    build:
      context: .
      dockerfile: hero-association-assets/Dockerfile
    depends_on:
      postgres-assets:
        condition: service_healthy
      core:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-assets:5432/hero_association_assets
      QUARKUS_DATASOURCE_USERNAME: hero_association_assets
      QUARKUS_DATASOURCE_PASSWORD: ${HERO_ASSOCIATION_ASSETS_DATABASE_PASSWORD:?Set
        the separate Market database password.}
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: drop-and-create
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: import.sql
      HERO_ASSOCIATION_CORE_BASE_URL: http://core:8081
      HERO_ASSOCIATION_ASSETS_MARKET_SERVICE_KEY: ${HERO_ASSOCIATION_ASSETS_MARKET_SERVICE_KEY:?Set
        a dedicated Market Assets service key of at least 32 characters.}
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/hero-association
      HERO_ASSOCIATION_OIDC_ISSUER: http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}/realms/hero-association
      HERO_ASSOCIATION_ASSETS_CORE_SERVICE_KEY: ${HERO_ASSOCIATION_ASSETS_CORE_SERVICE_KEY:?Set
        the dedicated Core Assets credential.}
      HERO_ASSOCIATION_ASSETS_QUEST_SERVICE_KEY: ${HERO_ASSOCIATION_ASSETS_QUEST_SERVICE_KEY:?Set
        the dedicated service credential of at least 32 characters.}
    expose:
    - '8085'
  postgres-world:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: hero_association_world
      POSTGRES_USER: hero_association_world
      POSTGRES_PASSWORD: ${HERO_ASSOCIATION_WORLD_DATABASE_PASSWORD:?Set the separate
        world database password.}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
    - postgres_world_data:/var/lib/postgresql
    ports:
    - ${HERO_ASSOCIATION_WORLD_DATABASE_HOST_PORT:-15436}:5432
  world:
    build:
      context: .
      dockerfile: hero-association-world/Dockerfile
    depends_on:
      postgres-world:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-world:5432/hero_association_world
      QUARKUS_DATASOURCE_USERNAME: hero_association_world
      QUARKUS_DATASOURCE_PASSWORD: ${HERO_ASSOCIATION_WORLD_DATABASE_PASSWORD:?Set
        the separate world database password.}
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: drop-and-create
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: import.sql
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/hero-association
      HERO_ASSOCIATION_OIDC_ISSUER: http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}/realms/hero-association
      HERO_ASSOCIATION_WORLD_SERVICE_KEY: ${HERO_ASSOCIATION_WORLD_SERVICE_KEY:?Set
        the dedicated service credential of at least 32 characters.}
    expose:
    - '8086'
  postgres-quest:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: hero_association_quest
      POSTGRES_USER: hero_association_quest
      POSTGRES_PASSWORD: ${HERO_ASSOCIATION_QUEST_DATABASE_PASSWORD:?Set the separate
        quest database password.}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
    - postgres_quest_data:/var/lib/postgresql
    ports:
    - ${HERO_ASSOCIATION_QUEST_DATABASE_HOST_PORT:-15437}:5432
  quest:
    build:
      context: .
      dockerfile: hero-association-quest/Dockerfile
    depends_on:
      postgres-quest:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-quest:5432/hero_association_quest
      QUARKUS_DATASOURCE_USERNAME: hero_association_quest
      QUARKUS_DATASOURCE_PASSWORD: ${HERO_ASSOCIATION_QUEST_DATABASE_PASSWORD:?Set
        the separate quest database password.}
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: drop-and-create
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: import.sql
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/hero-association
      HERO_ASSOCIATION_OIDC_ISSUER: http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}/realms/hero-association
      HERO_ASSOCIATION_CORE_BASE_URL: http://core:8081
      HERO_ASSOCIATION_ASSETS_BASE_URL: http://assets:8085
      HERO_ASSOCIATION_QUEST_CORE_SERVICE_KEY: ${HERO_ASSOCIATION_QUEST_CORE_SERVICE_KEY:?Set
        the dedicated service credential of at least 32 characters.}
      HERO_ASSOCIATION_QUEST_EXPEDITION_SERVICE_KEY: ${HERO_ASSOCIATION_QUEST_EXPEDITION_SERVICE_KEY:?Set
        the dedicated service credential of at least 32 characters.}
      HERO_ASSOCIATION_ASSETS_QUEST_SERVICE_KEY: ${HERO_ASSOCIATION_ASSETS_QUEST_SERVICE_KEY:?Set
        the dedicated service credential of at least 32 characters.}
    expose:
    - '8087'
volumes:
  postgres_keycloak_data: null
  postgres_core_data: null
  postgres_market_data: null
  postgres_assets_data: null
  postgres_world_data: null
  postgres_quest_data: null
