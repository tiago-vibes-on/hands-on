quarkus.application.name=hero-association-bff

quarkus.otel.exporter.otlp.endpoint=${HERO_ASSOCIATION_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.propagators=tracecontext
quarkus.otel.instrument.vertx-redis-client=false
quarkus.otel.logs.level=INFO
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
# Raw agency paths contain persistent IDs; keep their metrics, not their traces.
quarkus.otel.traces.suppress-application-uris=auth*,api/v1/agencies*
quarkus.otel.sdk.disabled=${HERO_ASSOCIATION_OTEL_DISABLED:true}
%test.quarkus.otel.sdk.disabled=false
%test.quarkus.otel.exporter.otlp.enabled=false
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.http.port=8080
%dev.quarkus.http.port=${HERO_ASSOCIATION_BFF_HTTP_PORT:17080}

hero-association.core.base-url=${HERO_ASSOCIATION_CORE_BASE_URL:http://localhost:${HERO_ASSOCIATION_CORE_HTTP_PORT:17081}}
hero-association.expedition.base-url=${HERO_ASSOCIATION_EXPEDITION_BASE_URL:http://localhost:${HERO_ASSOCIATION_EXPEDITION_HTTP_PORT:17083}}
hero-association.expedition.websocket.enabled=${HERO_ASSOCIATION_EXPEDITION_WEBSOCKET_ENABLED:false}
hero-association.frontend-url=${HERO_ASSOCIATION_FRONTEND_URL:https://heroassociation.test}
hero-association.edge-auth.enabled=${HERO_ASSOCIATION_EDGE_AUTH_ENABLED:false}

quarkus.oidc.auth-server-url=${HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL:http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:17180}/realms/hero-association}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.authorization-path=${HERO_ASSOCIATION_OIDC_AUTHORIZATION_PATH:https://auth.heroassociation.test/realms/hero-association/protocol/openid-connect/auth}
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.token.issuer=${HERO_ASSOCIATION_OIDC_ISSUER:https://auth.heroassociation.test/realms/hero-association}
quarkus.oidc.client-id=hero-association-bff
quarkus.oidc.credentials.secret=${HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.state-secret=${HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET}
# Only this standard OIDC registration hint may be forwarded from the protected
# login route. Quarkus retains ownership of OIDC state and PKCE parameters.
quarkus.oidc.authentication.forward-params=prompt
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.state-cookie-same-site=lax
%dev.quarkus.oidc.authentication.cookie-force-secure=${HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE:true}
quarkus.oidc.authentication.cookie-force-secure=${HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE:false}
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.authentication.session-age-extension=30M
quarkus.oidc.token.refresh-token-time-skew=30S
quarkus.oidc.end-session-path=${QUARKUS_OIDC_END_SESSION_PATH:https://auth.heroassociation.test/realms/hero-association/protocol/openid-connect/logout}
quarkus.oidc.logout.path=/auth/logout
quarkus.oidc.logout.post-logout-path=/auth/post-logout
# The post-logout state cookie must survive until Keycloak returns to /auth/post-logout.
# Quarkus removes the BFF session cookie as part of the RP-initiated logout flow.
quarkus.oidc.logout.clear-site-data=cache

%dev.quarkus.http.proxy.proxy-address-forwarding=true
%dev.quarkus.http.proxy.allow-x-forwarded=true
%dev.quarkus.http.proxy.enable-forwarded-host=true
%dev.quarkus.http.access-log.enabled=true
%dev.quarkus.http.access-log.pattern=%m %R %s

%dev.quarkus.redis.hosts=redis://localhost:${HERO_ASSOCIATION_BFF_REDIS_HOST_PORT:16379}
%prod.quarkus.redis.hosts=${HERO_ASSOCIATION_BFF_REDIS_URL}

quarkus.rest-csrf.create-token-path=/api/v1/session
quarkus.rest-csrf.cookie-name=hero-association-csrf
quarkus.rest-csrf.cookie-path=/
quarkus.rest-csrf.cookie-http-only=true
%dev.quarkus.rest-csrf.cookie-force-secure=${HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE:true}
quarkus.rest-csrf.cookie-force-secure=${HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE:false}
quarkus.rest-csrf.token-header-name=X-CSRF-TOKEN
quarkus.rest-csrf.token-signature-key=${HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY}
quarkus.rest-csrf.require-form-url-encoded=false

%test.quarkus.oidc.enabled=false
%test.hero-association.edge-auth.enabled=true
%test.hero-association.expedition.websocket.enabled=true
%test.hero-association.expedition.bff-service-key=test-only-expedition-bff-service-key-0123456789
%test.quarkus.redis.devservices.enabled=true
%test.quarkus.http.test-port=0
%test.hero-association.core.test-access-token=test-access-token
%test.quarkus.oidc.credentials.secret=test-oidc-client-secret-that-is-at-least-thirty-two-characters
%test.quarkus.oidc.authentication.state-secret=test-oidc-state-secret-that-is-at-least-thirty-two-characters
%test.quarkus.rest-csrf.token-signature-key=test-csrf-token-signature-key-that-is-at-least-thirty-two-characters

hero-association.market.base-url=${HERO_ASSOCIATION_MARKET_BASE_URL:http://localhost:${HERO_ASSOCIATION_MARKET_HTTP_PORT:17084}}

hero-association.assets.base-url=${HERO_ASSOCIATION_ASSETS_BASE_URL:http://localhost:17085}

hero-association.world.base-url=${HERO_ASSOCIATION_WORLD_BASE_URL:http://localhost:17086}
hero-association.quest.base-url=${HERO_ASSOCIATION_QUEST_BASE_URL:http://localhost:17087}
