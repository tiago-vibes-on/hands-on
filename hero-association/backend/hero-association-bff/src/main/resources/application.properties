quarkus.application.name=hero-association-bff
quarkus.http.port=8080

hero-association.core.base-url=http://localhost:8081
hero-association.frontend-url=${HERO_ASSOCIATION_FRONTEND_URL:http://localhost:5173}

quarkus.oidc.auth-server-url=${HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/hero-association}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.authorization-path=${HERO_ASSOCIATION_OIDC_AUTHORIZATION_PATH:/protocol/openid-connect/auth}
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.client-id=hero-association-bff
quarkus.oidc.credentials.secret=${HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.state-secret=${HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET}
# Only this standard OIDC registration hint may be forwarded from the protected
# login route. Quarkus retains ownership of OIDC state and PKCE parameters.
quarkus.oidc.authentication.forward-params=prompt
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.state-cookie-same-site=lax
quarkus.oidc.authentication.cookie-force-secure=${HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE:false}
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.authentication.session-age-extension=30M
quarkus.oidc.token.refresh-token-time-skew=30S
quarkus.oidc.end-session-path=/protocol/openid-connect/logout
quarkus.oidc.logout.path=/auth/logout
quarkus.oidc.logout.post-logout-path=/auth/post-logout
# The post-logout state cookie must survive until Keycloak returns to /auth/post-logout.
# Quarkus removes the BFF session cookie as part of the RP-initiated logout flow.
quarkus.oidc.logout.clear-site-data=cache

quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=hero_association_bff
%dev.quarkus.datasource.password=${HERO_ASSOCIATION_BFF_DATABASE_PASSWORD}
%dev.quarkus.datasource.reactive.url=${HERO_ASSOCIATION_BFF_DATABASE_URL:postgresql://localhost:5433/hero_association_bff}
%prod.quarkus.datasource.username=hero_association_bff
%prod.quarkus.datasource.password=${HERO_ASSOCIATION_BFF_DATABASE_PASSWORD}
%prod.quarkus.datasource.reactive.url=${HERO_ASSOCIATION_BFF_DATABASE_URL}

quarkus.rest-csrf.create-token-path=/api/v1/session
quarkus.rest-csrf.cookie-name=hero-association-csrf
quarkus.rest-csrf.cookie-path=/
quarkus.rest-csrf.cookie-http-only=true
quarkus.rest-csrf.cookie-force-secure=${HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE:false}
quarkus.rest-csrf.token-header-name=X-CSRF-TOKEN
quarkus.rest-csrf.token-signature-key=${HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY}
quarkus.rest-csrf.require-form-url-encoded=false

%test.quarkus.oidc.enabled=false
%test.hero-association.core.test-access-token=test-access-token
%test.quarkus.oidc.credentials.secret=test-oidc-client-secret-that-is-at-least-thirty-two-characters
%test.quarkus.oidc.authentication.state-secret=test-oidc-state-secret-that-is-at-least-thirty-two-characters
%test.quarkus.rest-csrf.token-signature-key=test-csrf-token-signature-key-that-is-at-least-thirty-two-characters
