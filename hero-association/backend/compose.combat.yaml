name: hero-association-combat

# Optional Combat sandbox. It is not connected to the live Core quest path.
services:
  postgres-combat:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: hero_association_combat
      POSTGRES_USER: hero_association_combat
      POSTGRES_PASSWORD: hero_association_combat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${HERO_ASSOCIATION_COMBAT_DATABASE_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_combat_data:/var/lib/postgresql

  rabbitmq-combat:
    image: rabbitmq:4.2.9-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hero_association_combat
      RABBITMQ_DEFAULT_PASS: ${HERO_ASSOCIATION_COMBAT_RABBITMQ_PASSWORD:-hero_association_combat}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${HERO_ASSOCIATION_COMBAT_RABBITMQ_HOST_PORT:-15673}:5672"
      - "${HERO_ASSOCIATION_COMBAT_RABBITMQ_MANAGEMENT_HOST_PORT:-15674}:15672"
    volumes:
      - rabbitmq_combat_data:/var/lib/rabbitmq
  combat:
    build:
      context: .
      dockerfile: hero-association-combat/Dockerfile
    depends_on:
      postgres-combat:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HERO_ASSOCIATION_COMBAT_DATABASE_URL: jdbc:postgresql://postgres-combat:5432/hero_association_combat
      HERO_ASSOCIATION_COMBAT_DATABASE_USER: hero_association_combat
      HERO_ASSOCIATION_COMBAT_DATABASE_PASSWORD: hero_association_combat
      HERO_ASSOCIATION_COMBAT_WORKER_ENABLED: ${HERO_ASSOCIATION_COMBAT_WORKER_ENABLED:-false}
      HERO_ASSOCIATION_COMBAT_OUTBOX_ENABLED: ${HERO_ASSOCIATION_COMBAT_OUTBOX_ENABLED:-false}
      HERO_ASSOCIATION_COMBAT_RABBITMQ_HOST: rabbitmq-combat
      HERO_ASSOCIATION_COMBAT_RABBITMQ_PORT: 5672
      HERO_ASSOCIATION_COMBAT_RABBITMQ_USER: hero_association_combat
      HERO_ASSOCIATION_COMBAT_RABBITMQ_PASSWORD: ${HERO_ASSOCIATION_COMBAT_RABBITMQ_PASSWORD:-hero_association_combat}
      QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: drop-and-create
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://host.docker.internal:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:-17180}/realms/hero-association
      HERO_ASSOCIATION_OIDC_ISSUER: https://auth.heroassociation.test/realms/hero-association
    ports:
      - "${HERO_ASSOCIATION_COMBAT_HTTP_PORT:-17082}:8082"

volumes:
  postgres_combat_data:
  rabbitmq_combat_data:
