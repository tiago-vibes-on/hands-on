quarkus.application.name=hero-association-quest
quarkus.http.port=8087
%dev.quarkus.http.port=${HERO_ASSOCIATION_QUEST_HTTP_PORT:17087}
quarkus.oidc.auth-server-url=${HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL:http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:17180}/realms/hero-association}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.client-id=hero-association-quest
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${HERO_ASSOCIATION_OIDC_ISSUER:https://auth.heroassociation.test/realms/hero-association}
quarkus.oidc.token.audience=hero-association-quest
quarkus.oidc.token.subject-required=true
quarkus.http.auth.permission.quest-api.paths=/api/*
quarkus.http.auth.permission.quest-api.policy=authenticated
hero-association.core.base-url=${HERO_ASSOCIATION_CORE_BASE_URL:http://localhost:17081}
hero-association.quest.bootstrap-mode=${HERO_ASSOCIATION_QUEST_BOOTSTRAP_MODE:false}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18.6-alpine3.24
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${HERO_ASSOCIATION_QUEST_DATABASE_HOST_PORT:15437}/hero_association_quest
%dev.quarkus.datasource.username=hero_association_quest
%dev.quarkus.datasource.password=${HERO_ASSOCIATION_QUEST_DATABASE_PASSWORD:hero_association_quest}
%dev.quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=import.sql
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.datasource.devservices.reuse=false
%test.quarkus.oidc.enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.http.test-port=0
quarkus.otel.sdk.disabled=${HERO_ASSOCIATION_OTEL_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${HERO_ASSOCIATION_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.propagators=tracecontext
quarkus.micrometer.binder.http-server.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

quarkus.hibernate-orm.schema-management.halt-on-error=true
quarkus.transaction-manager.default-transaction-timeout=20s

hero-association.quest.core-service-key=${HERO_ASSOCIATION_QUEST_CORE_SERVICE_KEY:}
hero-association.quest.expedition-service-key=${HERO_ASSOCIATION_QUEST_EXPEDITION_SERVICE_KEY:}
hero-association.assets.base-url=${HERO_ASSOCIATION_ASSETS_BASE_URL:http://localhost:17085}
hero-association.assets.quest-service-key=${HERO_ASSOCIATION_ASSETS_QUEST_SERVICE_KEY:}
%test.hero-association.quest.core-service-key=test-quest-core-service-key-012345678901234567
%test.hero-association.quest.expedition-service-key=test-quest-expedition-service-key-012345678901
%test.hero-association.assets.quest-service-key=test-assets-quest-service-key-0123456789012345
%test.hero-association.quest.test-access-token=test-quest-player-token
