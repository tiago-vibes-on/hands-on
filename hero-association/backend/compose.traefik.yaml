# Optional packaged HTTPS stack. Combine this with compose.yaml; normal local
# development uses compose.infra.yaml and host-run Vite/Quarkus instead.
services:
  postgres-core:
    ports: !override []

  redis-bff:
    ports: !override []

  keycloak:
    environment:
      KC_HOSTNAME: https://auth.heroassociation.test
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports: !override []

  core:
    environment:
      HERO_ASSOCIATION_OIDC_ISSUER: https://auth.heroassociation.test/realms/hero-association

  bff:
    environment:
      HERO_ASSOCIATION_FRONTEND_URL: https://heroassociation.test
      HERO_ASSOCIATION_OIDC_AUTHORIZATION_PATH: https://auth.heroassociation.test/realms/hero-association/protocol/openid-connect/auth
      QUARKUS_OIDC_TOKEN_ISSUER: https://auth.heroassociation.test/realms/hero-association
      QUARKUS_OIDC_END_SESSION_PATH: https://auth.heroassociation.test/realms/hero-association/protocol/openid-connect/logout
      HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE: "true"
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
      QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_HOST: "true"
    ports: !override []

  frontend:
    build:
      context: ../frontend
    expose:
      - "80"

  traefik:
    image: traefik:v3.7.13
    depends_on:
      frontend:
        condition: service_started
      bff:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "${HERO_ASSOCIATION_HTTP_PORT:-80}:80"
      - "${HERO_ASSOCIATION_HTTPS_PORT:-443}:443"
    volumes:
      - ../traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ../traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - ../traefik/certs:/etc/traefik/certs:ro
