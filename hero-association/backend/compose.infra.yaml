name: hero-association

# Local-development dependencies and HTTPS gateway for the host-run services.
services:
  postgres-keycloak:
    extends:
      file: compose.yaml
      service: postgres-keycloak

  keycloak:
    extends:
      file: compose.yaml
      service: keycloak
    environment:
      KC_HOSTNAME: https://auth.heroassociation.test
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

  postgres-core:
    extends:
      file: compose.yaml
      service: postgres-core

  redis-bff:
    extends:
      file: compose.yaml
      service: redis-bff

  redis-core:
    extends:
      file: compose.yaml
      service: redis-core

  traefik:
    image: traefik:v3.7.13
    depends_on:
      keycloak:
        condition: service_started
    # scripts/start-infra.sh resolves this address each time WSL starts.
    extra_hosts:
      - "dev-host:${HERO_ASSOCIATION_DEV_HOST_ADDRESS:-host-gateway}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ../traefik/dynamic.dev.yaml:/etc/traefik/dynamic.yaml:ro
      - ../traefik/certs:/etc/traefik/certs:ro

volumes:
  postgres_keycloak_data:
  postgres_core_data:
