quarkus.application.name=hero-association-world
quarkus.http.port=8086
%dev.quarkus.http.port=${HERO_ASSOCIATION_WORLD_HTTP_PORT:17086}
quarkus.oidc.auth-server-url=${HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL:http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:17180}/realms/hero-association}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.client-id=hero-association-world
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${HERO_ASSOCIATION_OIDC_ISSUER:https://auth.heroassociation.test/realms/hero-association}
quarkus.oidc.token.audience=hero-association-world
quarkus.oidc.token.subject-required=true
quarkus.http.auth.permission.world-api.paths=/api/*
quarkus.http.auth.permission.world-api.policy=authenticated
hero-association.core.base-url=${HERO_ASSOCIATION_CORE_BASE_URL:http://localhost:17081}
hero-association.world.bootstrap-mode=${HERO_ASSOCIATION_WORLD_BOOTSTRAP_MODE:false}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18.6-alpine3.24
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${HERO_ASSOCIATION_WORLD_DATABASE_HOST_PORT:15436}/hero_association_world
%dev.quarkus.datasource.username=hero_association_world
%dev.quarkus.datasource.password=${HERO_ASSOCIATION_WORLD_DATABASE_PASSWORD:hero_association_world}
%dev.quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=import.sql
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.datasource.devservices.reuse=false
%test.quarkus.oidc.enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.http.test-port=0
quarkus.otel.sdk.disabled=${HERO_ASSOCIATION_OTEL_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${HERO_ASSOCIATION_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.propagators=tracecontext
quarkus.micrometer.binder.http-server.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

quarkus.hibernate-orm.schema-management.halt-on-error=true
quarkus.transaction-manager.default-transaction-timeout=20s

hero-association.world.service-key=${HERO_ASSOCIATION_WORLD_SERVICE_KEY:}
%test.hero-association.world.service-key=test-world-service-key-01234567890123456789
