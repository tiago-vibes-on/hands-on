name: hero-association-native

services:
  postgres-keycloak:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_DATABASE_PASSWORD.}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Copy .env.example to .env and set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME.}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD.}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:?Copy .env.example to .env and set KEYCLOAK_DATABASE_PASSWORD.}
      KC_HOSTNAME: http://localhost:8180
      HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET: ${HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET:?Copy .env.example to .env and set HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET.}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro

  postgres-core:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: hero_association
      POSTGRES_USER: hero_association
      POSTGRES_PASSWORD: hero_association
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_core_data:/var/lib/postgresql

  postgres-bff:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: hero_association_bff
      POSTGRES_USER: hero_association_bff
      POSTGRES_PASSWORD: ${HERO_ASSOCIATION_BFF_DATABASE_PASSWORD:?Copy .env.example to .env and set HERO_ASSOCIATION_BFF_DATABASE_PASSWORD.}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_bff_data:/var/lib/postgresql
    ports:
      - "${HERO_ASSOCIATION_BFF_DATABASE_HOST_PORT:-5433}:5432"

  core:
    build:
      context: ./hero-association-core
      dockerfile: Dockerfile.native
      target: native-runtime
    depends_on:
      postgres-core:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-core:5432/hero_association
      QUARKUS_DATASOURCE_USERNAME: hero_association
      QUARKUS_DATASOURCE_PASSWORD: hero_association
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/hero-association
      HERO_ASSOCIATION_OIDC_ISSUER: http://localhost:8180/realms/hero-association
    expose:
      - "8081"

  bff:
    build:
      context: ./hero-association-bff
    depends_on:
      core:
        condition: service_started
      postgres-bff:
        condition: service_healthy
    environment:
      HERO_ASSOCIATION_CORE_BASE_URL: http://core:8081
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/hero-association
      HERO_ASSOCIATION_OIDC_AUTHORIZATION_PATH: http://localhost:8180/realms/hero-association/protocol/openid-connect/auth
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8180/realms/hero-association
      HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET: ${HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET:?Copy .env.example to .env and set HERO_ASSOCIATION_BFF_OIDC_CLIENT_SECRET.}
      HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET: ${HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET:?Copy .env.example to .env and set HERO_ASSOCIATION_BFF_OIDC_STATE_SECRET.}
      HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY: ${HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY:?Copy .env.example to .env and set HERO_ASSOCIATION_BFF_CSRF_TOKEN_SIGNATURE_KEY.}
      HERO_ASSOCIATION_BFF_DATABASE_PASSWORD: ${HERO_ASSOCIATION_BFF_DATABASE_PASSWORD:?Copy .env.example to .env and set HERO_ASSOCIATION_BFF_DATABASE_PASSWORD.}
      HERO_ASSOCIATION_BFF_DATABASE_URL: postgresql://postgres-bff:5432/hero_association_bff
    ports:
      - "8080:8080"

volumes:
  postgres_keycloak_data:
  postgres_core_data:
  postgres_bff_data:
