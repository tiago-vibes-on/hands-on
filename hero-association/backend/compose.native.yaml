name: hero-association-native

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: hero_association
      POSTGRES_USER: hero_association
      POSTGRES_PASSWORD: hero_association
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: Dockerfile.native
      target: native-runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/hero_association
      QUARKUS_DATASOURCE_USERNAME: hero_association
      QUARKUS_DATASOURCE_PASSWORD: hero_association
    ports:
      - "8080:8080"

volumes:
  postgres_data:
