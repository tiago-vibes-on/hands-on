quarkus.application.name=hero-association-expedition
quarkus.http.port=${HERO_ASSOCIATION_EXPEDITION_HTTP_PORT:17083}
quarkus.oidc.auth-server-url=${HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL:http://localhost:${HERO_ASSOCIATION_KEYCLOAK_HTTP_PORT:17180}/realms/hero-association}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.client-id=hero-association-expedition
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${HERO_ASSOCIATION_OIDC_ISSUER:https://auth.heroassociation.test/realms/hero-association}
quarkus.oidc.token.audience=hero-association-expedition
quarkus.oidc.token.subject-required=true
quarkus.http.auth.permission.expedition-api.paths=/api/*
quarkus.http.auth.permission.expedition-api.policy=authenticated
expedition.player-api.enabled=${HERO_ASSOCIATION_EXPEDITION_PLAYER_API_ENABLED:false}
expedition.visual-api.enabled=${HERO_ASSOCIATION_EXPEDITION_VISUAL_API_ENABLED:false}
%dev.quarkus.redis.hosts=redis://localhost:${HERO_ASSOCIATION_EXPEDITION_REDIS_HOST_PORT:16381}
%prod.quarkus.redis.hosts=${HERO_ASSOCIATION_EXPEDITION_REDIS_URL:redis://localhost:16381}
expedition.worker.enabled=${HERO_ASSOCIATION_EXPEDITION_WORKER_ENABLED:false}
expedition.settlement.enabled=${HERO_ASSOCIATION_EXPEDITION_SETTLEMENT_ENABLED:false}
expedition.rabbitmq.host=${HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST:localhost}
expedition.rabbitmq.port=${HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST_PORT:15675}
expedition.rabbitmq.username=${HERO_ASSOCIATION_EXPEDITION_WORKER_RABBITMQ_USER:hero_association_expedition_worker}
expedition.rabbitmq.password=${HERO_ASSOCIATION_EXPEDITION_WORKER_RABBITMQ_PASSWORD:hero_association_expedition_worker}
%test.quarkus.oidc.enabled=false
%test.expedition.visual-api.enabled=true
%test.hero-association.expedition.bff-service-key=test-only-expedition-bff-service-key-0123456789
hero-association.quest.base-url=${HERO_ASSOCIATION_QUEST_BASE_URL:http://localhost:17087}
hero-association.quest.expedition-service-key=${HERO_ASSOCIATION_QUEST_EXPEDITION_SERVICE_KEY:}
