quarkus.application.name=hero-association-combat
quarkus.http.port=8082
%dev.quarkus.http.port=${HERO_ASSOCIATION_COMBAT_HTTP_PORT:17082}
hero-association.combat.worker.enabled=${HERO_ASSOCIATION_COMBAT_WORKER_ENABLED:false}
%test.hero-association.combat.worker.enabled=false
hero-association.combat.outbox.enabled=${HERO_ASSOCIATION_COMBAT_OUTBOX_ENABLED:false}
%test.hero-association.combat.outbox.enabled=false
hero-association.combat.rabbitmq.host=${HERO_ASSOCIATION_COMBAT_RABBITMQ_HOST:localhost}
hero-association.combat.rabbitmq.port=${HERO_ASSOCIATION_COMBAT_RABBITMQ_PORT:15673}
hero-association.combat.rabbitmq.username=${HERO_ASSOCIATION_COMBAT_RABBITMQ_USER:hero_association_combat}
hero-association.combat.rabbitmq.password=${HERO_ASSOCIATION_COMBAT_RABBITMQ_PASSWORD:hero_association_combat}


quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18.6-alpine3.24
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${HERO_ASSOCIATION_COMBAT_DATABASE_HOST_PORT:15432}/hero_association_combat
%dev.quarkus.datasource.username=hero_association_combat
%dev.quarkus.datasource.password=hero_association_combat
%dev.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.jdbc.url=${HERO_ASSOCIATION_COMBAT_DATABASE_URL}
%prod.quarkus.datasource.username=${HERO_ASSOCIATION_COMBAT_DATABASE_USER}
%prod.quarkus.datasource.password=${HERO_ASSOCIATION_COMBAT_DATABASE_PASSWORD}
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

quarkus.oidc.auth-server-url=${HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL:http://localhost:17180/realms/hero-association}
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.client-id=hero-association-combat
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=${HERO_ASSOCIATION_OIDC_ISSUER:https://auth.heroassociation.test/realms/hero-association}
quarkus.oidc.token.audience=hero-association-combat
quarkus.oidc.token.subject-required=true
quarkus.http.auth.permission.internal.paths=/internal/*
quarkus.http.auth.permission.internal.policy=authenticated

%test.quarkus.oidc.enabled=false
%test.quarkus.http.test-port=0
