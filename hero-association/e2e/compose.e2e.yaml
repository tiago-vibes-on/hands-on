services:
  postgres-core:
    ports: !override
      - "15432:5432"

  redis-bff:
    ports: !override
      - "16380:6379"

  redis-core:
    ports: !override []

  keycloak:
    environment:
      KC_HOSTNAME: https://auth.heroassociation.test
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports: !override
      - "18180:8080"

  core:
    environment:
      HERO_ASSOCIATION_OIDC_ISSUER: https://auth.heroassociation.test/realms/hero-association
    ports:
      - "18081:8081"

  bff:
    environment:
      HERO_ASSOCIATION_FRONTEND_URL: https://heroassociation.test
      HERO_ASSOCIATION_OIDC_AUTHORIZATION_PATH: https://auth.heroassociation.test/realms/hero-association/protocol/openid-connect/auth
      QUARKUS_OIDC_END_SESSION_PATH: https://auth.heroassociation.test/realms/hero-association/protocol/openid-connect/logout
      QUARKUS_OIDC_TOKEN_ISSUER: https://auth.heroassociation.test/realms/hero-association
      HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE: "true"
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
      QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_HOST: "true"
      QUARKUS_OIDC_TOKEN_REFRESH_TOKEN_TIME_SKEW: 2S
    ports: !override
      - "18080:8080"

  bff-secondary:
    extends:
      file: ../backend/compose.yaml
      service: bff
    environment:
      HERO_ASSOCIATION_FRONTEND_URL: https://heroassociation.test
      HERO_ASSOCIATION_OIDC_AUTHORIZATION_PATH: https://auth.heroassociation.test/realms/hero-association/protocol/openid-connect/auth
      QUARKUS_OIDC_END_SESSION_PATH: https://auth.heroassociation.test/realms/hero-association/protocol/openid-connect/logout
      QUARKUS_OIDC_TOKEN_ISSUER: https://auth.heroassociation.test/realms/hero-association
      HERO_ASSOCIATION_BFF_COOKIE_FORCE_SECURE: "true"
      QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
      QUARKUS_HTTP_PROXY_ALLOW_X_FORWARDED: "true"
      QUARKUS_HTTP_PROXY_ENABLE_FORWARDED_HOST: "true"
      QUARKUS_OIDC_TOKEN_REFRESH_TOKEN_TIME_SKEW: 2S
    ports: !override
      - "18082:8080"

  frontend:
    build:
      context: ../frontend
    expose:
      - "80"

  traefik:
    image: traefik:v3.7.13
    depends_on:
      frontend:
        condition: service_started
      bff:
        condition: service_started
      bff-secondary:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      HERO_ASSOCIATION_FRONTEND_UPSTREAM: http://frontend:80
      HERO_ASSOCIATION_BFF_UPSTREAM: http://bff:8080
    ports:
      - "18443:443"
    volumes:
      - ../traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ../traefik/dynamic.e2e.yaml:/etc/traefik/dynamic.yaml:ro
      - ../traefik/certs:/etc/traefik/certs:ro
    networks:
      default:
        aliases:
          - heroassociation.test
          - auth.heroassociation.test
