# Added only by `npm run test:expedition`; the normal E2E stack stays unchanged.
services:
  redis-expedition:
    image: redis:7
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - expedition_redis_data:/data

  rabbitmq-expedition:
    image: rabbitmq:4.2.9-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hero_association_expedition
      RABBITMQ_DEFAULT_PASS: ${HERO_ASSOCIATION_E2E_EXPEDITION_RABBITMQ_PASSWORD:?E2E launcher supplies this value.}
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq-expedition-setup:
    image: node:24-alpine
    depends_on:
      rabbitmq-expedition:
        condition: service_healthy
    volumes:
      - ../backend/rabbitmq/prepare-expedition.mjs:/app/prepare-expedition.mjs:ro
    command: [node, /app/prepare-expedition.mjs]
    environment:
      RABBITMQ_SETUP_ADMIN_PASSWORD: ${HERO_ASSOCIATION_E2E_EXPEDITION_RABBITMQ_PASSWORD:?E2E launcher supplies this value.}
      RABBITMQ_SETUP_EXPEDITION_PASSWORD: ${HERO_ASSOCIATION_E2E_EXPEDITION_WORKER_RABBITMQ_PASSWORD:?E2E launcher supplies this value.}
      RABBITMQ_SETUP_CORE_PASSWORD: ${HERO_ASSOCIATION_E2E_CORE_SETTLEMENT_RABBITMQ_PASSWORD:?E2E launcher supplies this value.}

  core:
    depends_on:
      rabbitmq-expedition-setup:
        condition: service_completed_successfully
    environment:
      HERO_ASSOCIATION_EXPEDITION_CORE_SERVICE_KEY: ${HERO_ASSOCIATION_E2E_EXPEDITION_CORE_SERVICE_KEY:?E2E launcher supplies this value.}
      HERO_ASSOCIATION_CORE_EXPEDITION_ENABLED: "true"
      HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST: rabbitmq-expedition
      HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST_PORT: "5672"
      HERO_ASSOCIATION_CORE_SETTLEMENT_RABBITMQ_PASSWORD: ${HERO_ASSOCIATION_E2E_CORE_SETTLEMENT_RABBITMQ_PASSWORD:?E2E launcher supplies this value.}

  expedition:
    build:
      context: ../backend
      dockerfile: hero-association-expedition/Dockerfile
    depends_on:
      core:
        condition: service_started
      redis-expedition:
        condition: service_healthy
      rabbitmq-expedition-setup:
        condition: service_completed_successfully
    environment:
      HERO_ASSOCIATION_EXPEDITION_HTTP_PORT: "8083"
      HERO_ASSOCIATION_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/hero-association
      HERO_ASSOCIATION_OIDC_ISSUER: https://auth.heroassociation.test/realms/hero-association
      HERO_ASSOCIATION_CORE_BASE_URL: http://core:8081
      HERO_ASSOCIATION_EXPEDITION_REDIS_URL: redis://redis-expedition:6379
      HERO_ASSOCIATION_EXPEDITION_CORE_SERVICE_KEY: ${HERO_ASSOCIATION_E2E_EXPEDITION_CORE_SERVICE_KEY:?E2E launcher supplies this value.}
      HERO_ASSOCIATION_EXPEDITION_BFF_SERVICE_KEY: ${HERO_ASSOCIATION_E2E_EXPEDITION_BFF_SERVICE_KEY:?E2E launcher supplies this value.}
      HERO_ASSOCIATION_EXPEDITION_PLAYER_API_ENABLED: "true"
      HERO_ASSOCIATION_EXPEDITION_VISUAL_API_ENABLED: "true"
      HERO_ASSOCIATION_EXPEDITION_WORKER_ENABLED: "true"
      HERO_ASSOCIATION_EXPEDITION_SETTLEMENT_ENABLED: "true"
      HERO_ASSOCIATION_EXPEDITION_ADMISSION_RECONCILER_ENABLED: "true"
      HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST: rabbitmq-expedition
      HERO_ASSOCIATION_EXPEDITION_RABBITMQ_HOST_PORT: "5672"
      HERO_ASSOCIATION_EXPEDITION_WORKER_RABBITMQ_PASSWORD: ${HERO_ASSOCIATION_E2E_EXPEDITION_WORKER_RABBITMQ_PASSWORD:?E2E launcher supplies this value.}
    ports:
      - "127.0.0.1:18083:8083"

  bff:
    depends_on:
      expedition:
        condition: service_started
    environment:
      HERO_ASSOCIATION_EXPEDITION_BASE_URL: http://expedition:8083
      HERO_ASSOCIATION_EXPEDITION_WEBSOCKET_ENABLED: "true"
      HERO_ASSOCIATION_EXPEDITION_BFF_SERVICE_KEY: ${HERO_ASSOCIATION_E2E_EXPEDITION_BFF_SERVICE_KEY:?E2E launcher supplies this value.}

  bff-secondary:
    depends_on:
      expedition:
        condition: service_started
    environment:
      HERO_ASSOCIATION_EXPEDITION_BASE_URL: http://expedition:8083
      HERO_ASSOCIATION_EXPEDITION_WEBSOCKET_ENABLED: "true"
      HERO_ASSOCIATION_EXPEDITION_BFF_SERVICE_KEY: ${HERO_ASSOCIATION_E2E_EXPEDITION_BFF_SERVICE_KEY:?E2E launcher supplies this value.}

  frontend:
    build:
      args:
        VITE_EXPEDITION_ENABLED: "true"

volumes:
  expedition_redis_data:
