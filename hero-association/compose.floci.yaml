name: hero-association-floci

# Optional local AWS emulator; independent of the active k3d/hybrid application.
services:
  floci:
    image: floci/floci:2.1.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci_data:/app/data

volumes:
  floci_data:
